      children:
      - id: N09
        type: decision
        title: Balance the local default against response time
        support_level: explicit
        choice: The deployment chooses Gemma 4 12B as a practical local default and offers the larger Qwen
          configuration optionally. Historical observations inform this operational choice, but no contemporaneous
          Gemma–Qwen3.8 comparison, measured utility function or user-tolerance study establishes an optimum.
        evidence:
        - C03
        - C06
        source_refs:
        - paper/source/main.tex:Deployment selection is a policy choice
        alternatives:
        - Select the larger Qwen configuration by strict score alone.
    - id: N10
      type: experiment
      title: Add a separate hosted API observation
      support_level: explicit
      result: The API extension retains 84 attempts with unchanged tasks and written scoring. All requests
        return HTTP 200, yet only 64/72 primary attempts pass. The distinct local-application/API route and
        lack of a contemporaneous comparator prevent an isolated model ranking.
      evidence:
      - C01
