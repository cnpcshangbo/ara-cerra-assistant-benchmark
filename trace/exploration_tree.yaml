    - id: N11
      type: experiment
      title: Audit what the shared failures actually mean
      support_level: explicit
      result: The audit identifies a confirmed shared visibility-keyword scope override on MD01, an implicit
        annual-row requirement on MD04, and a requested but premature year change under MD17’s clarify-first
        policy. Missing raw planner intermediates limit model attribution. Frozen scores stay unchanged; these
        issues are exposed for question-design review.
