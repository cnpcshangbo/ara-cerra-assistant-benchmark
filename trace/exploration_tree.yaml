      children:
      - id: N06
        type: dead_end
        title: An incomplete narrative review packet misstates the rubric
        support_level: explicit
        failure_mode: The first packet omits original scoring qualifications and treats every proposition as
          mandatory. These judgments are not used as the final audited record.
        evidence:
        - C05
        source_refs:
        - logic/solution/audit-history.md:Narrative packet correction
        hypothesis: No prospective hypothesis was stated. This was an attempted adjudication route whose incomplete
          guidance was later discovered.
        lesson: A blinded reviewer still needs complete original requirements and optionality; retain the initial
          review and disclose correction instead of silently replacing its history.
      - id: N07
        type: decision
        title: Restore complete guidance and re-review unchanged answers
        support_level: explicit
        choice: All 24 identity-blind records are re-reviewed with the full frozen notes and anonymous historical
          calibration. Fifteen decisions change. Initial judgments remain preserved; no response is regenerated
          and no oracle is changed.
        evidence:
        - C05
        source_refs:
        - logic/solution/audit-history.md:September 24 correction receipt
        timestamp: '2026-09-24T20:54:50.118177+00:00'
        alternatives:
        - Publish the stricter incomplete-packet judgments.
    - id: N08
      type: experiment
      title: Run a contemporaneous local Qwen comparison
      support_level: explicit
      result: The paired run retains 168 outcomes, 54 browser records and 24 narrative reviews. Strict success
        rises from 49/72 to 63/72, while median request time rises from 3.77 to 14.50 seconds. Shared hardware
        does not remove differences in size and observed CPU offload.
      evidence:
      - C02
      - C03
      - C06
      source_refs:
      - evidence/campaigns.json
      - evidence/expected-aggregates.json
      - evidence/evaluated-records.json
