  original_event_timestamps: Campaign nodes use actual retained run-window finish times; correction uses recorded
    correction timestamp. Missing original decision times are omitted, not fabricated.
  scope: Only benchmark design, results, adjudication and interpretation. Unrelated private research and operational
    history excluded.
