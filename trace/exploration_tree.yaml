tree:
- id: N01
  type: question
  title: What makes an analytical assistant correct?
  support_level: explicit
  description: The study asks how configured assistants perform when success requires source use, task intent,
    narrative qualifications and actual interface effects together; how a local accuracy gain relates to latency
    and repetition; and which distinctions a single strict score hides. This question structure is reconstructed
    from the paper, not recorded as an external preregistration.
  evidence:
  - C01
  - C02
  - C03
  source_refs:
  - paper/source/main.tex:Introduction
  children:
  - id: N02
    type: decision
    title: Define workflow checks and retain controls separately
    support_level: explicit
    choice: Freeze task prompts, canonical context, operation/scope, source evidence, propositions and permitted
      state effects. Evaluate application outcomes and exclude previously shown or deterministic controls from
      the primary score.
    evidence:
    - C01
    - C02
    - C06
    source_refs:
    - paper/source/main.tex:Tasks, Oracles, and Metrics
    - benchmark/scoring-contract.json
    alternatives:
    - Using response text or HTTP completion alone would omit interface and source-scope checks; this is the
      paper’s methodological contrast, not a newly invented pilot.
    children:
    - id: N03
      type: experiment
      title: Observe three deployed local configurations
      support_level: explicit
      result: The initial campaign retains 252 application attempts. An aggregation layer added after the written
        freeze enforces pre-existing model-identity and browser-evidence requirements; original and protocol
        grades are preserved. Functional equivalence is a post-hoc diagnostic, kept separate from strict success.
      evidence:
      - C01
      - C02
      - C06
      source_refs:
